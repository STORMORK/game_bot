<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пиратское Море</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0e1621; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 80vh; background: #1b4965; overflow: hidden; }
        .ship { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; transition: left 0.1s linear; }
        .target { position: absolute; font-size: 32px; top: -50px; }
        #ui { height: 20vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f2537; gap: 10px; }
        .controls { display: flex; gap: 20px; }
        button { background: #e63946; color: white; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:active { background: #c1121f; }
        #score-board { font-size: 20px; color: #ffb703; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ship" class="ship">🏴‍☠️</div>
    </div>

    <div id="ui">
        <div id="score-board">Пиастры: <span id="score">0</span> 🪙</div>
        <div class="controls">
            <button onclick="moveShip(-35)">⬅️ Влево</button>
            <button onclick="moveShip(35)">Вправо ➡️</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let shipPos = window.innerWidth / 2;
        const ship = document.getElementById('ship');
        const container = document.getElementById('game-container');

        function moveShip(offset) {
            shipPos = Math.max(30, Math.min(window.innerWidth - 30, shipPos + offset));
            ship.style.left = shipPos + 'px';
        }

        function spawnTarget() {
            const target = document.createElement('div');
            target.className = 'target';
            const isChest = Math.random() > 0.3;
            target.innerText = isChest ? '🪙' : '💣';
            target.dataset.type = isChest ? 'coin' : 'bomb';
            
            const randomX = Math.random() * (window.innerWidth - 40) + 20;
            target.style.left = randomX + 'px';
            container.appendChild(target);

            let top = -50;
            const fallInterval = setInterval(() => {
                top += 4;
                target.style.top = top + 'px';

                if (top > window.innerHeight * 0.8 - 60 && top < window.innerHeight * 0.8) {
                    const targetX = parseFloat(target.style.left);
                    if (Math.abs(targetX - shipPos) < 40) {
                        if (target.dataset.type === 'coin') {
                            score += 10;
                            document.getElementById('score').innerText = score;
                        } else {
                            score = Math.max(0, score - 20);
                            document.getElementById('score').innerText = score;
                        }
                        clearInterval(fallInterval);
                        target.remove();
                    }
                }

                if (top > window.innerHeight * 0.8) {
                    clearInterval(fallInterval);
                    target.remove();
                }
            }, 30);
        }

        setInterval(spawnTarget, 1500);
    </script>
</body>
</html>
