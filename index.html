<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пиратская Алхимия и Море</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0e1621; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 75vh; background: linear-gradient(#1b4965, #0f2537); overflow: hidden; }
        .ship { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 52px; transition: left 0.1s linear; }
        .target { position: absolute; font-size: 36px; top: -50px; }
        #ui { height: 25vh; display: flex; flex-direction: column; justify-content: space-around; align-items: center; background: #0f2537; padding: 10px; border-top: 2px solid #1b4965; }
        .controls { display: flex; gap: 15px; width: 100%; justify-content: center; }
        button { background: #e63946; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1; max-width: 150px; }
        button:active { background: #c1121f; }
        .stats { display: flex; gap: 20px; font-size: 18px; font-weight: bold; color: #ffb703; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ship" class="ship">🏴‍☠️</div>
    </div>

    <div id="ui">
        <div class="stats">
            <div>🪙 Пиастры: <span id="score">0</span></div>
            <div>🍾 Ром: <span id="rum">3</span></div>
        </div>
        <div class="controls">
            <button onclick="moveShip(-40)">⬅️ Влево</button>
            <button onclick="moveShip(40)">Вправо ➡️</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let rum = 3;
        let shipPos = window.innerWidth / 2;
        const ship = document.getElementById('ship');
        const container = document.getElementById('game-container');

        function moveShip(offset) {
            shipPos = Math.max(30, Math.min(window.innerWidth - 30, shipPos + offset));
            ship.style.left = shipPos + 'px';
        }

        function spawnItem() {
            const item = document.createElement('div');
            item.className = 'target';
            
            // Алхимическая и пиратская тематика предметов
            const itemsList = [
                { icon: '🪙', type: 'coin', val: 10 },
                { icon: '🧪', type: 'potion', val: 25 },
                { icon: '🍾', type: 'rum', val: 1 },
                { icon: '💣', type: 'bomb', val: -20 }
            ];
            
            const randomChoice = itemsList[Math.floor(Math.random() * itemsList.length)];
            item.innerText = randomChoice.icon;
            item.dataset.type = randomChoice.type;
            item.dataset.val = randomChoice.val;
            
            const randomX = Math.random() * (window.innerWidth - 50) + 25;
            item.style.left = randomX + 'px';
            container.appendChild(item);

            let top = -50;
            const fallInterval = setInterval(() => {
                top += 4.5;
                item.style.top = top + 'px';

                // Проверка столкновения с кораблем
                if (top > window.innerHeight * 0.75 - 70 && top < window.innerHeight * 0.75) {
                    const itemX = parseFloat(item.style.left);
                    if (Math.abs(itemX - shipPos) < 45) {
                        if (item.dataset.type === 'rum') {
                            rum += parseInt(item.dataset.val);
                            document.getElementById('rum').innerText = rum;
                        } else {
                            score = Math.max(0, score + parseInt(item.dataset.val));
                            document.getElementById('score').innerText = score;
                        }
                        
                        // Отправка данных обратно в Телеграм-бота (опционально)
                        if (tg.initDataUnsafe?.user) {
                            // Здесь можно добавить отправку очков
                        }

                        clearInterval(fallInterval);
                        item.remove();
                    }
                }

                if (top > window.innerHeight * 0.75) {
                    clearInterval(fallInterval);
                    item.remove();
                }
            }, 30);
        }

        setInterval(spawnItem, 1300);
    </script>
</body>
</html>
